name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Two tests run against the "local" profile, which uses MySQL, so CI provides a throwaway one.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: devvault
          MYSQL_USER: devvault_app
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'      # a JDK, not a JRE: the Java code judge tests compile submitted code
          cache: maven

      - name: Create the git-ignored local profile
        run: |
          cat > src/main/resources/application-local.properties <<'EOF'
          spring.datasource.url=jdbc:mysql://127.0.0.1:3306/devvault
          spring.datasource.username=devvault_app
          spring.datasource.password=ci-only-password
          spring.jpa.hibernate.ddl-auto=update
          EOF

      - name: Build and test
        run: bash ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
