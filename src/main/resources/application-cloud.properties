# Public, read-only deployment: in-memory H2 re-seeded on every start (no database to pay for).
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:mem:devvault;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
devvault.readonly=true

# Never run strangers' Java on the public server unless you really intend to (needs a JDK image, see the README).
devvault.judge.java.enabled=${JUDGE_JAVA_ENABLED:false}
