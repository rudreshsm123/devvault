spring.application.name=devvault
spring.profiles.active=local

# Cache-busting: static files get a content hash in their URL, so browsers always load the newest CSS/JS after a deploy.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# Runs the learner's Java code in a separate process. ON for your own computer, OFF on the public demo
# (see application-cloud.properties) because it executes whatever is submitted.
devvault.judge.java.enabled=true

# AI explainer for wrong drill answers. none = built-in explanations only (default, also on the public demo).
#   claude = hosted Claude through the Anthropic Java SDK (needs the ANTHROPIC_API_KEY environment variable)
#   ollama = a small model on your own computer (install Ollama, then: ollama pull qwen2.5:3b)
#   openai = any hosted "chat completions" service, for example Google Gemini or Groq, which have free tiers
#            (set AI_API_KEY; AI_BASE_URL and AI_MODEL change the service, the defaults point at Gemini)
devvault.ai.provider=${AI_PROVIDER:none}
devvault.ai.claude.model=${AI_CLAUDE_MODEL:claude-opus-5-5}
devvault.ai.max-requests-per-hour=20
devvault.ai.openai.api-key=${AI_API_KEY:}
devvault.ai.openai.base-url=${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
devvault.ai.openai.model=${AI_MODEL:gemini-3.8-flash}
devvault.ai.openai.label=${AI_LABEL:gemini}
# Comma-separated models to try when the main one is overloaded (e.g. gemini-2.5-flash,gemini-2.5-flash-lite)
devvault.ai.openai.fallback-models=${AI_FALLBACK_MODELS:}

# Login throttling: after this many failed sign-ins for one username from one address within the window,
# further attempts from that address are refused until the oldest failure is older than the window.
devvault.security.login.max-failures=5
devvault.security.login.max-failures-per-address=30
devvault.security.login.window-minutes=15
