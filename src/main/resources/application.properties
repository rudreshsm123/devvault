spring.application.name=devvault
spring.profiles.active=local

# Cache-busting: static files get a content hash in their URL, so browsers always load the newest CSS/JS after a deploy.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# Runs the learner's Java code in a separate process. ON for your own computer, OFF on the public demo
# (see application-cloud.properties) because it executes whatever is submitted.
devvault.judge.java.enabled=true
