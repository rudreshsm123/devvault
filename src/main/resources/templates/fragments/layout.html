<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="head">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>DevVault</title>
        <link rel="stylesheet" th:href="@{/css/style.css}">
        <link rel="stylesheet" th:href="@{/css/tide.css}">
        <script th:src="@{/js/tide.js}" defer></script>
        <link rel="stylesheet" th:href="@{/css/progress.css}">
        <script th:src="@{/js/progress.js}" defer></script>
        <meta name="author" content="Rajesh S M">
        <meta name="devvault-user" th:if="${currentUser != null}" th:content="${currentUser}">
        <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
        <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    </th:block>
</head>
<body>
    <nav th:fragment="sidebar" class="sidebar">
        <div class="logo">DevVault</div>
        <div class="sidebar-user" th:if="${currentUser != null}">
            <span>Signed in as <strong th:text="${currentUser}"></strong></span>
            <form th:action="@{/logout}" method="post"><button type="submit" class="link-button">Sign out</button></form>
        </div>
        <form class="sidebar-search" action="/search" method="get" role="search">
            <input type="search" name="q" placeholder="Search everything..." aria-label="Search everything" minlength="2">
        </form>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/dashboard">Dashboard</a></li>
            <li><a href="/learn">Learn</a></li>
            <li><a href="/progress">My Progress</a></li>
            <li><a href="/certificates">Certificates</a></li>
            <li><a href="/notes">Notes</a></li>
            <li><a href="/snippets">Snippets</a></li>
            <li><a href="/problems">Problems</a></li>
            <li><a href="/resources">Resources</a></li>
            <li><a href="/guide">Interview Prep Guide</a></li>
            <li><a href="/about">Skills &amp; Tech</a></li>
        </ul>
        <div class="readonly-banner" th:if="${readOnly}" role="status">
            <strong>Read-only demo</strong>
            <span>You can browse and practise, but adding, editing and deleting are disabled.</span>
        </div>
    </nav>
</body>
</html>
