<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="content">
        <div class="content-header">
            <h2 th:text="${note.id} == null ? 'New Note' : 'Edit Note'">Note</h2>
        </div>

        <form method="post" th:object="${note}"
              th:action="${note.id} == null ? @{/notes} : @{/notes/{id}/edit(id=${note.id})}">

            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" th:field="*{title}">
                <span class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
            </div>

            <div class="form-group">
                <label for="content">Content</label>
                <textarea id="content" rows="6" th:field="*{content}"></textarea>
                <span class="field-error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></span>
            </div>

            <div class="form-group">
                <label for="programmingLanguage">Programming Language</label>
                <input type="text" id="programmingLanguage" th:field="*{programmingLanguage}">
            </div>

            <div class="form-group">
                <label for="topic">Topic</label>
                <input type="text" id="topic" th:field="*{topic}">
            </div>

            <div class="form-group">
                <label for="difficulty">Difficulty</label>
                <select id="difficulty" th:field="*{difficulty}">
                    <option value="">-- Select --</option>
                    <option th:each="d : ${difficulties}" th:value="${d}" th:text="${d}"></option>
                </select>
            </div>

            <div class="form-group">
                <label for="tags">Tags (comma-separated)</label>
                <input type="text" id="tags" th:field="*{tags}">
            </div>

            <div class="form-group checkbox-group">
                <label>
                    <input type="checkbox" th:field="*{important}">
                    Important
                </label>
            </div>

            <div class="form-group">
                <label for="revisionStatus">Revision Status</label>
                <select id="revisionStatus" th:field="*{revisionStatus}">
                    <option th:each="r : ${revisionStatuses}" th:value="${r}" th:text="${r}"></option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Save</button>
                <a href="/notes">Cancel</a>
            </div>
        </form>
    </main>
</div>
</body>
</html>
