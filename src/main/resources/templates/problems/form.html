<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="content">
        <div class="content-header">
            <h2 th:text="${problem.id} == null ? 'New Coding Problem' : 'Edit Coding Problem'">Problem</h2>
        </div>

        <form method="post" th:object="${problem}"
              th:action="${problem.id} == null ? @{/problems} : @{/problems/{id}/edit(id=${problem.id})}">

            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" th:field="*{title}">
                <span class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" rows="4" th:field="*{description}"></textarea>
                <span class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
            </div>

            <div class="form-group">
                <label for="topic">Topic</label>
                <input type="text" id="topic" th:field="*{topic}" placeholder="e.g. Binary Search, Dynamic Programming">
            </div>

            <div class="form-group">
                <label for="difficulty">Difficulty</label>
                <select id="difficulty" th:field="*{difficulty}">
                    <option value="">-- Select --</option>
                    <option th:each="d : ${difficulties}" th:value="${d}" th:text="${d}"></option>
                </select>
            </div>

            <div class="form-group">
                <label for="solutionCode">Solution Code</label>
                <textarea id="solutionCode" rows="12" class="code-input" th:field="*{solutionCode}"></textarea>
            </div>

            <div class="form-group">
                <label for="lineByLine">Line-by-line explanation (one per line: code fragment ==&gt; why it is there)</label>
                <textarea id="lineByLine" rows="8" class="code-input" th:field="*{lineByLine}"></textarea>
            </div>

            <div class="form-group">
                <label for="interviewTips">What the interviewer looks for</label>
                <textarea id="interviewTips" rows="4" th:field="*{interviewTips}"></textarea>
            </div>

            <div class="form-group">
                <label for="explanation">Explanation of Approach</label>
                <textarea id="explanation" rows="5" th:field="*{explanation}"></textarea>
            </div>

            <div class="form-group">
                <label for="timeComplexity">Time Complexity</label>
                <input type="text" id="timeComplexity" th:field="*{timeComplexity}" placeholder="e.g. O(n log n)">
            </div>

            <div class="form-group">
                <label for="spaceComplexity">Space Complexity</label>
                <input type="text" id="spaceComplexity" th:field="*{spaceComplexity}" placeholder="e.g. O(1)">
            </div>

            <div class="form-group">
                <label for="tags">Tags (comma-separated)</label>
                <input type="text" id="tags" th:field="*{tags}">
            </div>

            <div class="form-group">
                <label for="patternHint">Pattern Recognition Hint</label>
                <textarea id="patternHint" rows="3" th:field="*{patternHint}"
                          placeholder="What signal in the problem statement tells you which algorithm to use?"></textarea>
            </div>

            <div class="form-group">
                <label for="commonMistakes">Common Mistakes</label>
                <textarea id="commonMistakes" rows="3" th:field="*{commonMistakes}"></textarea>
            </div>

            <div class="form-group">
                <label for="companyTags">Company / Interview Tags</label>
                <input type="text" id="companyTags" th:field="*{companyTags}" placeholder="e.g. FAANG-style, systems-design-adjacent">
            </div>

            <div class="form-group">
                <label for="practiceStatus">Practice Status</label>
                <select id="practiceStatus" th:field="*{practiceStatus}">
                    <option th:each="s : ${practiceStatuses}" th:value="${s}" th:text="${s}"></option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Save</button>
                <a href="/problems">Cancel</a>
            </div>
        </form>
    </main>
</div>
</body>
</html>
