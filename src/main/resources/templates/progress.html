<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="content">
        <div class="content-header">
            <h2>My Progress</h2>
        </div>
        <p class="muted">
            Press <strong>Mark as done</strong> on any lesson or problem and it shows up here. Your progress is
            saved in <em>this browser only</em> (nothing is sent to the server), so it also works on the
            read-only public site. Clearing your browser data or switching devices starts a fresh list.
        </p>

        <div id="progress-root" th:attr="data-problems=${problemCount},data-lessons=${lessonCount},data-drills=${drillCount}"></div>

        <noscript><p>My Progress needs JavaScript to read the progress saved in your browser.</p></noscript>
    </main>
</div>
</body>
</html>
