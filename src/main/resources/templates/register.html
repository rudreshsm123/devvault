<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="content">
        <div class="content-header">
            <h2>Create an account</h2>
        </div>

        <div class="auth-card">
            <p class="auth-error" th:if="${error}" th:text="${error}"></p>

            <form method="post" th:action="@{/register}">
                <div class="form-group">
                    <label for="username">Username (3-30 letters, digits or _)</label>
                    <input type="text" id="username" name="username" th:value="${username}"
                           autocomplete="username" minlength="3" maxlength="30" pattern="[A-Za-z0-9_]{3,30}" autofocus required>
                </div>
                <div class="form-group">
                    <label for="password">Password (8-72 characters)</label>
                    <input type="password" id="password" name="password" autocomplete="new-password"
                           minlength="8" maxlength="72" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Repeat password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password"
                           minlength="8" maxlength="72" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Create account</button>
                    <a href="/login">I already have an account</a>
                </div>
            </form>

            <p class="muted auth-note" th:if="${readOnly}">
                This public demo keeps accounts in memory, so they are cleared whenever the server restarts.
            </p>
        </div>
    </main>
</div>
</body>
</html>
