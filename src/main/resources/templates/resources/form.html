<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="content">
        <div class="content-header">
            <h2 th:text="${resource.id} == null ? 'New Learning Resource' : 'Edit Learning Resource'">Resource</h2>
        </div>

        <form method="post" th:object="${resource}"
              th:action="${resource.id} == null ? @{/resources} : @{/resources/{id}/edit(id=${resource.id})}">

            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" th:field="*{title}">
                <span class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
            </div>

            <div class="form-group">
                <label for="url">URL</label>
                <input type="text" id="url" th:field="*{url}" placeholder="https://...">
                <span class="field-error" th:if="${#fields.hasErrors('url')}" th:errors="*{url}"></span>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" rows="4" th:field="*{description}"></textarea>
            </div>

            <div class="form-group">
                <label for="topic">Topic</label>
                <input type="text" id="topic" th:field="*{topic}">
            </div>

            <div class="form-group">
                <label for="resourceType">Resource Type</label>
                <select id="resourceType" th:field="*{resourceType}">
                    <option value="">-- Select --</option>
                    <option th:each="t : ${resourceTypes}" th:value="${t}" th:text="${t}"></option>
                </select>
            </div>

            <div class="form-group">
                <label for="tags">Tags (comma-separated)</label>
                <input type="text" id="tags" th:field="*{tags}">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Save</button>
                <a href="/resources">Cancel</a>
            </div>
        </form>
    </main>
</div>
</body>
</html>
